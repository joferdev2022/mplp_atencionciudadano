<div class="rating-container">
  <!-- Botón volver -->
  <button class="back-button" (click)="goBack()" matRipple aria-label="Volver">
    <mat-icon>arrow_back</mat-icon>
  </button>

  <!-- Header con logo centrado -->
  <header class="rating-header">
    <div class="header-logo-wrapper">
      <img
        src="assets/logo_municipalidad.jpg"
        alt="Escudo Municipalidad Provincial de Leoncio Prado"
        class="header-logo"
      />
    </div>
    <span class="header-municipality-name">Municipalidad Provincial Leoncio Prado</span>
  </header>

  <!-- Contenido principal -->
  <main class="rating-main">
    <h1 class="rating-title">
      ¿Cómo calificarías la<br />atención recibida?
    </h1>

    <!-- Área seleccionada -->
    <div class="rating-area-badge" *ngIf="selectedAreaName">
      <mat-icon class="badge-icon">business</mat-icon>
      <span>{{ selectedAreaName }}</span>
    </div>

    <!-- Estrellas de calificación -->
    <div class="rating-stars-section">
      <div class="stars-container">
        <button
          *ngFor="let star of stars"
          class="star-btn"
          [class.active]="star <= selectedRating"
          [class.hover]="star <= hoveredRating && hoveredRating > 0"
          (click)="selectRating(star)"
          (mouseenter)="onStarHover(star)"
          (mouseleave)="onStarLeave()"
          (touchstart)="selectRating(star)"
          [attr.aria-label]="star + ' estrella' + (star > 1 ? 's' : '')"
        >
          <mat-icon class="star-icon">
            {{ star <= (hoveredRating || selectedRating) ? 'star' : 'star_border' }}
          </mat-icon>
        </button>
      </div>

      <!-- Etiqueta de calificación -->
      <span class="rating-label" [class.visible]="selectedRating > 0">
        {{ getRatingLabel() }}
      </span>
    </div>

    <!-- Preguntas Sí / No -->
    <div class="yes-no-questions">
      <div class="question-card">
        <span class="question-text">¿El personal resolvió tus dudas?</span>
        <div class="question-options">
          <button
            class="option-btn"
            [class.selected]="answeredQuestions.resolvioDudas === true"
            (click)="answerQuestion('resolvioDudas', true)"
            matRipple
          >
            <mat-icon class="option-icon">thumb_up</mat-icon>
            Sí
          </button>
          <button
            class="option-btn option-no"
            [class.selected]="answeredQuestions.resolvioDudas === false"
            (click)="answerQuestion('resolvioDudas', false)"
            matRipple
          >
            <mat-icon class="option-icon">thumb_down</mat-icon>
            No
          </button>
        </div>
      </div>

      <div class="question-card">
        <span class="question-text">¿El tiempo de espera fue aceptable?</span>
        <div class="question-options">
          <button
            class="option-btn"
            [class.selected]="answeredQuestions.tiempoEspera === true"
            (click)="answerQuestion('tiempoEspera', true)"
            matRipple
          >
            <mat-icon class="option-icon">thumb_up</mat-icon>
            Sí
          </button>
          <button
            class="option-btn option-no"
            [class.selected]="answeredQuestions.tiempoEspera === false"
            (click)="answerQuestion('tiempoEspera', false)"
            matRipple
          >
            <mat-icon class="option-icon">thumb_down</mat-icon>
            No
          </button>
        </div>
      </div>
    </div>

    <!-- Campo de comentarios opcional -->
    <div class="rating-comment-section">
      <label class="comment-label">
        Comentarios adicionales
        <span class="comment-optional">(opcional)</span>
      </label>
      <div class="comment-field-wrapper">
        <textarea
          class="comment-textarea"
          [(ngModel)]="comment"
          placeholder="Cuéntanos más sobre tu experiencia..."
          rows="4"
          maxlength="500"
        ></textarea>
        <span class="comment-counter">{{ comment.length }}/500</span>
      </div>
    </div>
  </main>

  <!-- Footer con botón Enviar -->
  <footer class="rating-footer">
    <button
      mat-raised-button
      class="rating-btn-submit"
      [class.submitting]="isSubmitting"
      [disabled]="!isFormValid() || isSubmitting"
      [attr.aria-busy]="isSubmitting"
      (click)="onEnviar()"
      matRipple
    >
      <ng-container *ngIf="isSubmitting; else submitLabel">
        <span class="submit-content">
          <mat-spinner
            class="submit-spinner"
            [diameter]="20"
            aria-hidden="true"
          ></mat-spinner>
          <span>Enviando...</span>
        </span>
      </ng-container>
      <ng-template #submitLabel>Enviar calificación</ng-template>
    </button>
  </footer>
</div>
