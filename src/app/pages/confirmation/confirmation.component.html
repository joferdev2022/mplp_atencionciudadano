<div class="confirmation-container">
  <!-- Header con logo centrado -->
  <header class="confirmation-header">
    <div class="header-logo-wrapper">
      <img
        src="assets/logo_municipalidad.jpg"
        alt="Escudo Municipalidad Provincial de Leoncio Prado"
        class="header-logo"
      />
    </div>
    <span class="header-municipality-name">Municipalidad Provincial Leoncio Prado</span>
  </header>

  <!-- Contenido principal -->
  <main class="confirmation-main">
    <!-- Ilustración de agradecimiento -->
    <div class="thanks-illustration-wrapper">
      <img
        src="assets/tulumayogracias.png"
        alt="Tulumayo agradece tu opinión"
        class="thanks-illustration"
      />
    </div>

    <h1 class="confirmation-title">¡Gracias por tu opinión!</h1>

    <p class="confirmation-message">
      Tu respuesta ha sido enviada correctamente
    </p>
  </main>

  <!-- Footer con botón Volver al inicio -->
  <footer class="confirmation-footer">
    <button
      mat-raised-button
      class="confirmation-btn"
      (click)="onVolverInicio()"
      matRipple
    >
      Volver al inicio
    </button>
  </footer>
</div>
