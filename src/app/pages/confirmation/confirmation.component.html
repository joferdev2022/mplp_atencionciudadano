<div class="confirmation-container">
  <!-- Header con logo centrado -->
  <header class="confirmation-header">
    <div class="header-logo-wrapper">
      <img
        src="assets/logo_municipalidad.jpg"
        alt="Escudo Municipalidad Provincial de Leoncio Prado"
        class="header-logo"
      />
    </div>
    <span class="header-municipality-name">Municipalidad Provincial Leoncio Prado</span>
  </header>

  <!-- Contenido principal -->
  <main class="confirmation-main">
    <!-- Ícono de éxito -->
    <div class="success-icon-wrapper">
      <div class="success-circle">
        <mat-icon class="success-icon">check</mat-icon>
      </div>
    </div>

    <h1 class="confirmation-title">¡Gracias por tu opinión!</h1>

    <p class="confirmation-message">
      Tu respuesta ha sido enviada correctamente
    </p>

    <!-- Código de seguimiento -->
    <div class="tracking-section">
      <span class="tracking-label">Código de seguimiento</span>
      <div class="tracking-code-wrapper">
        <span class="tracking-code">{{ trackingCode }}</span>
        <button
          class="copy-btn"
          (click)="copyCode()"
          matRipple
          [attr.aria-label]="'Copiar código'"
        >
          <mat-icon class="copy-icon">{{ copied ? 'check' : 'content_copy' }}</mat-icon>
        </button>
      </div>
      <span class="tracking-hint">Guarda este código para consultar el estado de tu solicitud</span>
    </div>
  </main>

  <!-- Footer con botón Volver al inicio -->
  <footer class="confirmation-footer">
    <button
      mat-raised-button
      class="confirmation-btn"
      (click)="onVolverInicio()"
      matRipple
    >
      Volver al inicio
    </button>
  </footer>
</div>
